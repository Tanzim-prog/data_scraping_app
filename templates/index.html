<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrapy - Web Image Scraper</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center">Welcome to <span class="text-primary">Scrapy</span></h1>
        <p class="text-center">Effortlessly scrape images from any webpage.</p>

        <div class="card shadow p-4">
            <form id="scrape-form">
                <div class="mb-3">
                    <label for="url" class="form-label">Enter Website URL:</label>
                    <input type="text" class="form-control" id="url" name="url" placeholder="https://example.com" required>
                </div>

                <div class="mb-3">
                    <label for="destination" class="form-label">Destination Folder:</label>
                    <input type="text" class="form-control" id="destination" name="destination" placeholder="D:/Images" required>
                </div>

                <button type="submit" class="btn btn-primary w-100">Start Scraping</button>
            </form>

            <!-- Loading Spinner -->
            <div id="loading" class="text-center mt-3 d-none">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p>Scraping in progress... <span id="image-count">0</span> images downloaded.</p>
            </div>

            <!-- Result Message -->
            <div id="result" class="mt-3 text-center"></div>
        </div>
    </div>

    <script>
        $(document).ready(function () {
            $("#scrape-form").submit(function (e) {
                e.preventDefault();

                var url = $("#url").val();
                var destination = $("#destination").val();

                $("#loading").removeClass("d-none"); // Show loading spinner
                $("#result").text(""); // Clear any previous results

                // Establish EventSource connection for real-time image count
                var eventSource = new EventSource("/scrape-stream");
                eventSource.onmessage = function (e) {
                    if (e.data === "complete") {
                        eventSource.close();
                        $("#result").html('<div class="alert alert-success">Scraping completed successfully!</div>');
                    } else {
                        $("#image-count").text(e.data);
                    }
                };

                $.post("/", { url: url, destination: destination })
                    .done(function (response) {
                        console.log("Scraping started...");
                    })
                    .fail(function (error) {
                        console.log("Error:", error);
                        $("#result").html('<div class="alert alert-danger">Error occurred while scraping.</div>');
                    });
            });
        });
    </script>
</body>
</html>
